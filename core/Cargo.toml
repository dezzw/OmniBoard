[package]
name = "omniboard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OmniBoard local Core runtime (ItemStore, OPP host, EventBus)"

[[bin]]
name = "omniboard"
path = "src/bin/omniboard.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "io-std", "net"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
