name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios-simulator:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test for iOS Simulator
        run: |
          xcodebuild \
            -project OmniBoard.xcodeproj \
            -scheme OmniBoard \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build test
